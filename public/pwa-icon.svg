  <g
    fill="none"
    stroke="#f2f2f2"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M198 336V216" />
    <path d="M198 254c0-44 116-44 116 0v82" />
  </g>
</svg>
