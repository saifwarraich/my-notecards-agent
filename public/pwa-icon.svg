<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Full bleed: a maskable icon gets cropped to the platform's shape, so the
       background must fill the canvas and the mark must stay well inside it. -->
